<!DOCTYPE html>
<html lang='en' data-bs-theme="dark">
<head>
    <meta charset='UTF-8'>
    <meta name='viewport'
          content='width=device-width, user-scalable=yes, initial-scale=1.0, maximum-scale=3.0, minimum-scale=1.0'>
    <meta http-equiv='X-UA-Compatible' content='ie=edge'>
    <title>Midi recorder</title>
    <link rel='stylesheet' href='../midi_player.css'>
    <link rel='manifest' href='../manifest.json' />
    <link rel="icon" href="../icons/midiplayer-icon-16.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="robots" content="noindex">
</head>
<body>
    <a id="downloadAnchor" class="d-none" download></a>
    <div class="container-xl d-flex flex-column align-items-center w-100">
        <div class="d-flex flex-row align-items-center mt-2 border border-2 rounded-2 w-100">
            <div class="d-inline-block flex-shrink-0 flex-grow-0 ms-2 mt-2 mb-2" style="width: 4rem">
                <img src="../icons/midiplayer-icon.svg" class=".img-fluid rounded-3" style="width: 100%">
            </div>
            <div class="d-inline-block align-items-center flex-grow-0 flex-shrink-1 ms-2 mt-2 mb-2" style="width: 100%">
                <h2 id="title" class="text-center">Midi Recorder</h2>
            </div>
            <div class="d-inline-block align-items-center flex-shrink-0 flex-grow-0 ms-2 me-2 mt-2 mb-2" style="width: 4rem">
                <p id="version" class="text-end"></p>
            </div>
        </div>
        <div id="alertPlaceholder" class="d-flex mt-2 flex-column w-100"></div>
        <div class="d-flex flex-column align-items-left mt-2 border border-2 rounded-2 w-100">
            <div class="d-flex flex-row align-items-center mt-2 w-100">
                <div>
                    <button id="history" class="d-none dropdown-toggle" type="button" data-bs-toggle="dropdown">History</button>
                    <ul id="historyDropdown" class="dropdown-menu">
                    </ul>
                    <label id="history-label" for="history" class="button-label flex-grow-0 flex-shrink-0 align-items-center ms-2"></label>
                </div>
                <input type="file" id="midi_input" accept=".mid,.midi,audio/*" disabled class="d-none">
                <label id="midi_input-label" for="midi_input" class="button-label flex-grow-0 flex-shrink-0 align-items-center ms-2"></label>
                <div id="message" class="flex-grow-1 mx-2">Loading. Please wait...</div>
            </div>
            <div class="d-flex flex-row align-items-center mt-2 w-100">
                <input type="range" class="form-range flex-grow-1 flex-shrink-1 ms-2" min="0" max="0" value="0" step="1" id="progress" tabindex="-1" aria-hidden="true" style="pointer-events: none">
                <span id="currentTime" class="flex-grow-0 flex-shrink-0 ms-2">--:--</span>/<span id="totalTime" class="flex-grow-0 flex-shrink-0 me-2">--:--</span>
            </div>
            <div id="record_control_box" class="d-flex flex-row align-items-center my-2 flex-shrink-1 flex-grow-0">
                <button id="record" class="d-none">Record</button>
                <label id="record-label" for="record" class="button-label flex-grow-0 flex-shrink-0 align-items-center ms-2"></label>
                <button id="download" class="d-none">Download</button>
                <label id="download-label" for="download" class="button-label flex-grow-0 flex-shrink-0 align-items-center ms-2 invisible"></label>
                <select id="outputSampleRate" class="form-select w-auto flex-grow-0 flex-shrink-0 ms-2">
                    <option value="44100" selected>44.1 kHz</option>
                    <option value="22050">22.05 kHz</option>
                </select>
                <select id="outputChannels" class="form-select w-auto flex-grow-0 flex-shrink-0 ms-2 me-2">
                    <option value="stereo" selected>stereo</option>
                    <option value="mono">mono</option>
                </select>
            </div>
        </div>
        <div id="channel-controls" class="d-flex mt-2 mb-2 flex-column border border-2 rounded-2 w-100">
            <div id="channel-control-header" class = 'd-flex flex-row align-items-bottom my-2 w-100 border-bottom border-2'>
                <div class="d-flex ms-2 flex-grow-0" style="font-size: inherit; field-sizing: fixed; width: 15%; min-width: 3rem; overflow-wrap: anywhere;">
                    channel name
                </div>
                <div class="d-flex ms-2 flex-grow-0 flex-shrink-1" style="font-size: inherit; width: 60%; overflow-wrap: anywhere;">
                    channel volume
                </div>
                <div class="d-flex mx-2 flex-grow-0" style="font-size: inherit; field-sizing: fixed; width: 25%; min-width: 5rem; overflow-wrap: anywhere;">
                    channel instrument
                </div>
            </div>
        </div>
        <div id="channel-control-note" class="d-flex mb-2 text-body-secondary w-100">
            Volume and instrument are only applied to the channels you change here; untouched channels are recorded exactly as written in the midi file. Changes made here are not stored.
        </div>
    </div>
     <!-- note the type="module" -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <script src='recorder.js' type="module"></script>
</body>
</html>
